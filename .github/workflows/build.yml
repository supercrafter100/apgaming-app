name: Build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the iOS build to TestFlight
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  # Optional repository variable to point a build at another server (defaults to lib/config.dart).
  WEB_URL: ${{ vars.WEB_URL }}

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Push notifications are compiled in when config/firebase.json exists (see README)
      - name: Firebase config
        run: if [ -f config/firebase.json ]; then echo "FIREBASE_DEFINES=--dart-define-from-file=config/firebase.json" >> "$GITHUB_ENV"; fi

      # Without these secrets the release build is signed with debug keys (installable, not uploadable to Play).
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release --build-number=$GITHUB_RUN_NUMBER ${WEB_URL:+--dart-define=WEB_URL=$WEB_URL} $FIREBASE_DEFINES
      - name: Build app bundle
        run: flutter build appbundle --release --build-number=$GITHUB_RUN_NUMBER ${WEB_URL:+--dart-define=WEB_URL=$WEB_URL} $FIREBASE_DEFINES

      - name: Collect builds
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ap-gaming-hub.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/ap-gaming-hub.aab
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error

  ios:
    name: iOS
    needs: test
    runs-on: macos-latest
    env:
      HAS_IOS_SIGNING: ${{ secrets.IOS_DIST_CERT_P12_BASE64 != '' }}
      UPLOAD_TO_TESTFLIGHT: ${{ github.event_name == 'release' || inputs.testflight }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Push notifications are compiled in when config/firebase.json exists (see README)
      - name: Firebase config
        run: if [ -f config/firebase.json ]; then echo "FIREBASE_DEFINES=--dart-define-from-file=config/firebase.json" >> "$GITHUB_ENV"; fi

      # Without these secrets the build stays unsigned: it proves the app builds and can be sideloaded.
      - name: Configure iOS signing
        if: env.HAS_IOS_SIGNING == 'true'
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Distribution certificate, in a throwaway keychain
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$IOS_DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"

          # Provisioning profile; the team and profile name are read from it
          PROFILE="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE"
          security cms -D -i "$PROFILE" > "$RUNNER_TEMP/profile.plist"
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          # Xcode 16 and later read the first folder, older versions the second
          for dir in "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$PROFILE" "$dir/$PROFILE_UUID.mobileprovision"
          done

          # Release.xcconfig only applies to the Runner target, so Swift package targets stay unsigned
          # (passing these on the command line would fail on them). Local builds keep automatic signing.
          cat >> ios/Flutter/Release.xcconfig <<EOF

          CODE_SIGN_STYLE = Manual
          DEVELOPMENT_TEAM = $TEAM_ID
          PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME
          CODE_SIGN_IDENTITY = Apple Distribution
          CODE_SIGN_IDENTITY[sdk=iphoneos*] = Apple Distribution
          EOF

          # An App Store profile only allows the production push environment
          plutil -replace aps-environment -string production ios/Runner/Runner.entitlements

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>be.svinnovations.apGamingApp</key>
              <string>$PROFILE_NAME</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
          </dict>
          </plist>
          EOF

      - name: Build signed IPA
        if: env.HAS_IOS_SIGNING == 'true'
        run: |
          flutter build ipa --release --export-options-plist="$RUNNER_TEMP/ExportOptions.plist" --build-number=$GITHUB_RUN_NUMBER ${WEB_URL:+--dart-define=WEB_URL=$WEB_URL} $FIREBASE_DEFINES
          mkdir -p dist
          cp build/ios/ipa/*.ipa dist/ap-gaming-hub.ipa

      - name: Build iOS (no code signing)
        if: env.HAS_IOS_SIGNING != 'true'
        run: flutter build ios --release --no-codesign --build-number=$GITHUB_RUN_NUMBER ${WEB_URL:+--dart-define=WEB_URL=$WEB_URL} $FIREBASE_DEFINES

      - name: Package unsigned IPA
        if: env.HAS_IOS_SIGNING != 'true'
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qr ap-gaming-hub-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/
          if-no-files-found: error

      - name: Upload to TestFlight
        if: env.HAS_IOS_SIGNING == 'true' && env.UPLOAD_TO_TESTFLIGHT == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app --type ios -f dist/ap-gaming-hub.ipa --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Report skipped TestFlight upload
        if: env.HAS_IOS_SIGNING != 'true' && env.UPLOAD_TO_TESTFLIGHT == 'true'
        run: echo "::warning::Not uploaded to TestFlight because the iOS signing secrets are missing (see README)."

  release:
    name: GitHub release
    if: github.event_name == 'release'
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*
