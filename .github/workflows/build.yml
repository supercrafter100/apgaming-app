name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.7
  # Optional repository variable to point a build at another server (defaults to lib/config.dart).
  WEB_URL: ${{ vars.WEB_URL }}

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android
    needs: test
    runs-on: ubuntu-latest
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Push notifications are compiled in when config/firebase.json exists (see README)
      - name: Firebase config
        run: if [ -f config/firebase.json ]; then echo "FIREBASE_DEFINES=--dart-define-from-file=config/firebase.json" >> "$GITHUB_ENV"; fi

      # Without these secrets the release build is signed with debug keys (installable, not uploadable to Play).
      - name: Configure release signing
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      - name: Build APK
        run: flutter build apk --release --build-number=$GITHUB_RUN_NUMBER ${WEB_URL:+--dart-define=WEB_URL=$WEB_URL} $FIREBASE_DEFINES
      - name: Build app bundle
        run: flutter build appbundle --release --build-number=$GITHUB_RUN_NUMBER ${WEB_URL:+--dart-define=WEB_URL=$WEB_URL} $FIREBASE_DEFINES

      - name: Collect builds
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/ap-gaming-hub.apk
          cp build/app/outputs/bundle/release/app-release.aab dist/ap-gaming-hub.aab
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: dist/
          if-no-files-found: error

  ios:
    name: iOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      # Push notifications are compiled in when config/firebase.json exists (see README)
      - name: Firebase config
        run: if [ -f config/firebase.json ]; then echo "FIREBASE_DEFINES=--dart-define-from-file=config/firebase.json" >> "$GITHUB_ENV"; fi

      # Unsigned: proves the app builds and can be re-signed or sideloaded.
      # TestFlight/App Store needs an Apple Developer certificate and provisioning profile.
      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign --build-number=$GITHUB_RUN_NUMBER ${WEB_URL:+--dart-define=WEB_URL=$WEB_URL} $FIREBASE_DEFINES

      - name: Package unsigned IPA
        run: |
          mkdir -p dist/Payload
          cp -R build/ios/iphoneos/Runner.app dist/Payload/
          cd dist && zip -qr ap-gaming-hub-unsigned.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v7
        with:
          name: ios
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
